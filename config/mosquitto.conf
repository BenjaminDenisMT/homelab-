# Mosquitto configuration – 81 Logan Pi 5
# Permits unauthenticated local connections (LAN-only Pi)

listener 1883
allow_anonymous true

# WebSocket support (optional – for Home Assistant frontend)
listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type information
